[package]
name = "vesper-core"
version = "2.0.2"
edition = "2021"

[lib]
name = "vesper_core"
path = "src/lib.rs"

[[bin]]
name = "vesper-core"
path = "src/main.rs"

[[bin]]
name = "fakephone"
path = "src/bin/fakephone.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
mdns-sd = "0.13"
if-addrs = "0.13"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_System_Threading",
  "Devices_Bluetooth",
  "Devices_Bluetooth_Rfcomm",
  "Networking_Sockets",
  "Storage_Streams",
  "Foundation",
  "Foundation_Collections",
]

[[bin]]
name = "vesper-display"
path = "src/bin/display.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
